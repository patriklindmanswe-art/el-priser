name: Log SE3 electricity prices

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions schedules use UTC. Both times are needed to cover
    # 00:05 Europe/Stockholm during standard time and daylight-saving time.
    - cron: "5 22 * * *"
    - cron: "5 23 * * *"

permissions:
  contents: write

jobs:
  log-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check schedule in Stockholm time
        id: schedule-check
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          stockholm_hour="$(TZ=Europe/Stockholm date '+%H')"
          stockholm_minute="$(TZ=Europe/Stockholm date '+%M')"
          if [ "$stockholm_hour" = "00" ] && [ "$stockholm_minute" -le 30 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Running for Stockholm time ${stockholm_hour}:${stockholm_minute}."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping scheduled run at Stockholm time ${stockholm_hour}:${stockholm_minute}."
          fi

      - name: Set up Python
        if: steps.schedule-check.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.schedule-check.outputs.should_run == 'true'
        run: python -m pip install -r requirements.txt

      - name: Fetch today's SE3 prices
        if: steps.schedule-check.outputs.should_run == 'true'
        run: python fetch_se3_prices.py

      - name: Commit and push new CSV files
        if: steps.schedule-check.outputs.should_run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data

          if git diff --cached --quiet; then
            echo "No new price data to commit."
            exit 0
          fi

          git commit -m "Log SE3 prices"
          git push
